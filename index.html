<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link id="mb-favicon" rel="icon" type="image/png" href="/favicon-light.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F8F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0D10" />

    <!-- Theme: light by default, the visitor's saved choice wins.
         Runs before first paint so there is no flash of the wrong theme. -->
    <script>
      try {
        var savedTheme = localStorage.getItem("mb-theme")
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark")
          document.getElementById("mb-favicon").setAttribute("href", "/favicon-dark.png?v=2")
        }
      } catch (e) {
        /* light by default */
      }
    </script>

    <!-- Language: French by default; if this window's session already
         chose Arabic, apply lang/dir before first paint so a reload
         never flashes the page in the wrong direction. -->
    <script>
      try {
        if (sessionStorage.getItem("mb-lang") === "ar") {
          document.documentElement.lang = "ar"
          document.documentElement.dir = "rtl"
        }
      } catch (e) {
        /* French / LTR by default */
      }
    </script>

    <!-- Fonts: Plus Jakarta Sans (display), Playfair Display (serif accents), Azeret Mono (labels)
         + Arabic: IBM Plex Sans Arabic (texte) et Tajawal (titres) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Azeret+Mono:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <meta
      name="description"
      content="Mustapha Boukadia - Développeur Full Stack MERN | React, Node.js, Laravel"
    />
    <meta
      name="keywords"
      content="Mustapha Boukadia, Full Stack Developer, MERN, React, Node.js, Laravel, Portfolio"
    />
    <meta name="author" content="Mustapha Boukadia" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mustapha Boukadia | Full Stack Developer" />
    <meta
      property="og:description"
      content="Développeur Full Stack MERN passionné par la création d'applications web modernes."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_MA" />

    <title>Mustapha Boukadia | Développeur Full Stack MERN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
